packages:
  - 'plugins/*'
  - 'packages/*'

catalogs:
  deps:
    # typescript-eslint ecosystem (keep versions aligned)
    '@typescript-eslint/utils': '^8.69.0'

  dev:
    # typescript-eslint ecosystem (keep versions aligned)
    '@typescript-eslint/rule-tester': '8.69.0'
    typescript-eslint: '8.69.0'

    # build & test toolchain
    tsdown: '0.23.0'
    # keep `@vitest/coverage-v8` aligned with `vitest`
    '@vitest/coverage-v8': '5.0.0'
    vitest: '5.0.0'

    # published-artifact checks
    '@arethetypeswrong/cli': '0.18.5'

    # plugin dev utilities
    '@marcalexiei/prettier-config': '2.0.0'
    dedent: '1.7.2'
    eslint-doc-generator: '3.7.1'
    prettier: '3.9.6'

overrides:
  # vitest declares an optional `@types/node` peer: without a version here the
  # projects that don't depend on `@types/node` themselves resolve a second copy
  '@types/node': '24.13.2'

allowBuilds:
  # postinstall places the platform binary; without it `pnpm exec` fails
  lefthook: true
  unrs-resolver: true

trustPolicy: no-downgrade
minimumReleaseAge: 1440

dedupePeers: true
dedupePeerDependents: true
minimumReleaseAgeExclude:
  - fast-uri@3.1.5
  - js-yaml@4.3.1
  - nanoid@3.3.18
