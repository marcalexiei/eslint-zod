version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    groups:
      actions-marcalexiei:
        applies-to: 'version-updates'
        patterns:
          - 'marcalexiei/*'
    cooldown:
      default-days: 7

  # NOTE: groups intentionally omit `dependency-type`.
  # Dependabot classifies every pnpm catalog entry (pnpm-workspace.yaml) as `production`
  # regardless of how the referencing package.json declares it,
  # so a `dependency-type: development` filter silently excludes all of them and each one lands in its own PR.
  # See https://github.com/dependabot/dependabot-core/issues/14824.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    # A dependency joins the first group it matches, so order is significant.
    groups:
      changesets:
        applies-to: 'version-updates'
        patterns:
          - '@changesets/*'

      # typescript-eslint ships as one version across all its entry points
      typescript:
        applies-to: 'version-updates'
        patterns:
          - '@types/*'
          - '@typescript-eslint/*'
          - 'typescript'
          - 'typescript-eslint'

      # `@vitest/coverage-v8` must move with `vitest`
      vitest:
        applies-to: 'version-updates'
        patterns:
          - '@vitest/*'
          - 'vitest'

      eslint:
        applies-to: 'version-updates'
        patterns:
          - '@marcalexiei/eslint-config'
          - 'eslint'
          - 'eslint-import-resolver-*'
          - 'eslint-plugin-*'

      prettier:
        applies-to: 'version-updates'
        patterns:
          - '@marcalexiei/prettier-config'
          - 'prettier'

      tooling:
        applies-to: 'version-updates'
        patterns:
          - '@arethetypeswrong/cli'
          - 'dedent'
          - 'eslint-doc-generator'
          - 'knip'
          - 'lefthook'
          - 'tsdown'
    cooldown:
      default-days: 7
