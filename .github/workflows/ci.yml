name: CI

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test on Node ${{ matrix.node }} with ESLint ${{ matrix.eslint }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
          - 24
          - 26
        eslint:
          - 9
          - 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@92c64c084d3479cff756151cb8163d03608f2acd # v2.4.2
        with:
          node-version: ${{ matrix.node }}
          # Both ESLint legs of a Node.js version share a cache key.
          save-cache: ${{ matrix.eslint == 10 }}

      # The lockfile pins one ESLint major; the matrix tests the others.
      # jactionlint ignore=adhoc-packages
      - name: Install ESLint (if needed)
        if: ${{ matrix.eslint != 10 }}
        env:
          ESLINT_VERSION: ${{ matrix.eslint }}
        run: pnpm -r --include-workspace-root install "eslint@$ESLINT_VERSION" --save-dev

      - name: Run test
        run: pnpm run test

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@92c64c084d3479cff756151cb8163d03608f2acd # v2.4.2
        with:
          save-cache: false # shares its cache key with Code checks

      # Thresholds live in `vitest.config.ts` and are pinned just below the
      # measured baseline, so this job fails only on a regression. The `text`
      # reporter prints the uncovered lines of every file in the log above.
      - name: Run test with coverage
        run: pnpm run test:coverage

  code-checks:
    name: Code checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@92c64c084d3479cff756151cb8163d03608f2acd # v2.4.2

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # attw over `pnpm pack` tarballs of the four published packages.
      # Runs after Build because it inspects `dist`, not `src`.
      - name: Lint published artifacts
        run: pnpm run lint:publish

  ci-ok:
    name: CI OK
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    if: ${{ always() }}
    needs:
      - test
      - coverage
      - code-checks
    steps:
      - name: Exit with error if some jobs are not successful
        run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}
